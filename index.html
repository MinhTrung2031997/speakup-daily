<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>SpeakUp Daily</title>
    <script>
      try { var t = JSON.parse(localStorage.getItem('speakup:v1') || '{}'); if (t && t.settings && t.settings.dark) document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
